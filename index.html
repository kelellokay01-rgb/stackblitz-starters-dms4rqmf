<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>BLAQ AI | BLAQINK Technologies</title>
                <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
                    <style>
                            :root {
                                        --bg-color: #080b11;
                                                    --panel-bg: #0c1017;
                                                                --card-bg: #0f172a;
                                                                            --text-main: #f1f5f9;
                                                                                        --text-muted: #94a3b8;
                                                                                                    --border-color: #1e293b;
                                                                                                                --accent-blue: #38bdf8;
                                                                                                                            --btn-blue: #2563eb;
                                                                                                                                        --msg-user-bg: #1e293b;
                                                                                                                                                    --input-bg: #0c1017;
                                                                                                                                                            }

                                                                                                                                                                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                                                                                                                                                                            body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

                                                                                                                                                                                    .top-bar { height: 56px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--panel-bg); position: sticky; top: 0; z-index: 100; }
                                                                                                                                                                                            
                                                                                                                                                                                                    .brand-container { display: flex; align-items: center; gap: 10px; }
                                                                                                                                                                                                            .logo-icon { width: 32px; height: 32px; fill: #ffffff; }

                                                                                                                                                                                                                    .dropdown-pill { background: var(--card-bg); padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border-color); font-weight: 700; color: var(--accent-blue); display: flex; align-items: center; gap: 6px; }
                                                                                                                                                                                                                            .live-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

                                                                                                                                                                                                                                    .chat-container { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
                                                                                                                                                                                                                                            .chat-area { flex: 1; width: 100%; padding: 20px 16px 160px 16px; overflow-y: auto; }
                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                            .hero-banner { text-align: center; margin: 25px auto 25px auto; max-width: 450px; display: flex; flex-direction: column; align-items: center; }
                                                                                                                                                                                                                                                                    .hero-logo { width: 72px; height: 72px; fill: #ffffff; margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.3)); }
                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                    .hero-title { font-size: 36px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px; }
                                                                                                                                                                                                                                                                                            .hero-title span { color: var(--accent-blue); }
                                                                                                                                                                                                                                                                                                    .hero-subtitle { font-size: 11px; letter-spacing: 2px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; font-weight: 700; }

                                                                                                                                                                                                                                                                                                            .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
                                                                                                                                                                                                                                                                                                                    .chip-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 18px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
                                                                                                                                                                                                                                                                                                                            .chip-btn:hover { border-color: var(--accent-blue); }

                                                                                                                                                                                                                                                                                                                                    .chat-history { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 800px; margin: 0 auto; }
                                                                                                                                                                                                                                                                                                                                            .msg-user { align-self: flex-end; background: var(--msg-user-bg); color: var(--text-main); padding: 12px 16px; border-radius: 16px 16px 2px 16px; max-width: 88%; font-size: 14px; border: 1px solid var(--border-color); }
                                                                                                                                                                                                                                                                                                                                                    .msg-ai { align-self: flex-start; background: var(--panel-bg); color: var(--text-main); padding: 16px; border-radius: 12px; max-width: 95%; font-size: 14px; border: 1px solid var(--border-color); line-height: 1.6; width: 100%; }
                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                    .agent-badge { font-size: 10px; background: var(--card-bg); color: var(--accent-blue); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border-color); display: inline-block; margin-bottom: 10px; font-weight: 700; }

                                                                                                                                                                                                                                                                                                                                                                            .bottom-input-container { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px; z-index: 200; }
                                                                                                                                                                                                                                                                                                                                                                                    .input-wrapper { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 800px; margin: 0 auto; }
                                                                                                                                                                                                                                                                                                                                                                                            .prompt-input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 15px; width: 100%; resize: none; height: 44px; }
                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                            .input-actions { display: flex; justify-content: space-between; align-items: center; }
                                                                                                                                                                                                                                                                                                                                                                                                                    .send-btn { background: var(--btn-blue); color: #fff; border: none; padding: 8px 22px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="top-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="brand-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <svg class="logo-icon" viewBox="0 0 100 100">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" fill="none" stroke="#ffffff" stroke-width="6"/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <path d="M30 35 L48 25 L48 70 L30 60 Z" fill="#ffffff"/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <path d="M52 25 L70 35 L70 60 L52 70 Z" fill="#ffffff" opacity="0.8"/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div style="font-weight: 900; font-size: 18px; letter-spacing: -0.5px;">BLAQ <span style="color:var(--accent-blue);">AI</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="dropdown-pill"><span class="live-dot"></span> BLAQINK Technologies</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="chat-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="chat-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="hero-banner">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <svg class="hero-logo" viewBox="0 0 100 100">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" fill="none" stroke="#ffffff" stroke-width="6"/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <path d="M30 35 L48 25 L48 70 L30 60 Z" fill="#ffffff"/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <path d="M52 25 L70 35 L70 60 L52 70 Z" fill="#ffffff" opacity="0.85"/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h1 class="hero-title">BLAQ <span>AI</span></h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="hero-subtitle">Smarter Answers. Your Way.</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="quick-chips">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="chip-btn" onclick="quickPrompt('What is BLAQINK Technologies?')">🏢 What is BLAQINK?</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="chip-btn" onclick="quickPrompt('Generate an image of a cybernetic rover')">🎨 Fast Image</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="chip-btn, onclick="quickPrompt('Write a Python script for network scanning')">⚡ Fast Script</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="chat-history" id="chat-history"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="bottom-input-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="input-wrapper">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea id="prompt-input" class="prompt-input" placeholder="Ask BLAQ AI anything or generate an image..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="input-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span style="font-size: 11px; color: var(--text-muted);">⚡ Lightning Speed Engine</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="send-btn" id="send-btn">Send</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.addEventListener('DOMContentLoaded', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const sendBtn = document.getElementById('send-btn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const promptInput = document.getElementById('prompt-input');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const chatHistory = document.getElementById('chat-history');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.quickPrompt = function(txt) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            promptInput.value = txt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            sendPrompt();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function queryFastModel(userPrompt) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (userPrompt.toLowerCase().startsWith('generate an image') || userPrompt.toLowerCase().startsWith('create an image')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const encoded = encodeURIComponent(userPrompt.replace(/generate an image|create an image/gi, '').trim() || "futuristic technology logo");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return { type: 'image', url: `https://image.pollinations.ai/prompt/${encoded}?width=800&height=600&nologo=true`, prompt: userPrompt };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Instant hardcoded local responses for brand core questions to guarantee zero latency
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const lower = userPrompt.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (lower.includes('blaqink') || lower.includes('blaq-ai') || lower.includes('who made') || lower.includes('owner')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        type: 'text', 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                content: "**BLAQ AI** is an advanced artificial intelligence platform created, owned, and founded by **Kelello Effort Dibakwane** under the technology company **BLAQINK Technologies** (founded in 2026). Operating out of South Africa, BLAQINK builds real-world intelligent systems, software architectures, and robotics applications." 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const response = await fetch("https://text.pollinations.ai/", {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        headers: { "Content-Type": "application/json" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            messages: [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            { role: "system", content: "You are BLAQ AI, an ultra-fast AI created by BLAQINK Technologies (Kelello Dibakwane). Keep answers direct, punchy, and immediate." },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            { role: "user", content: userPrompt }
